[package]
name = "zy"
version = "2.0.0"
edition = "2021"
description = "Command-line tool and MCP server for the Cloudzy cloud"
authors = ["Cloudzy AI Information Technology L.L.C."]
repository = "https://github.com/CloudzyVPS/cli"

[lib]
name = "zy"
path = "src/lib.rs"

[[bin]]
name = "zy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2", "charset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.2", features = ["derive"] }
yansi = "1.0.1"
comfy-table = "7.2.1"
chrono = "0.4"
indicatif = "0.17"
tempfile = "3"
futures-util = "0.3"
url = "2"
base64 = "0.22"
rand = "0.8"
open = "5"
dirs = "5"

[dev-dependencies]
wiremock = "0.6"
